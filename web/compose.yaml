name: makan-client
services:
  web:
    image: makan-client:local
    build:
      context: .
      target: runtime
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      # Deployment values take precedence over stale entries in .env.docker.
      BACKEND_BASE_URL: http://94.184.32.84
      APP_ORIGIN: https://app.makanapp.org
      COOKIE_SECURE: 'true'
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      SESSION_DIRECTORY: /app/.makan-sessions
      CLIENT_COOKIE_NAME: makan_client_session_${MAKAN_PORT:-8080}
    ports:
      - '127.0.0.1:${MAKAN_PORT:-8080}:3000'
    volumes:
      - sessions:/app/.makan-sessions
    tmpfs:
      - /tmp:mode=1777
      - /app/.next/cache:uid=1000,gid=1000,mode=0700
    read_only: true
    user: '1000:1000'
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/enter', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
volumes:
  sessions:
