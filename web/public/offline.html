<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#1169b8" />
    <title>ماکان ارتباط قطع است</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #f5f9fc;
        color: #203442;
        font:
          16px/2 Tahoma,
          sans-serif;
        padding: 24px;
      }
      main {
        max-width: 440px;
        text-align: center;
      }
      img {
        width: 80px;
        height: 80px;
        border-radius: 20px;
      }
      h1 {
        font-size: 24px;
        margin: 24px 0 8px;
      }
      p {
        color: #586e7c;
      }
      a {
        display: inline-block;
        padding: 10px 24px;
        background: #1169b8;
        color: #fff;
        text-decoration: none;
        border-radius: 12px;
        min-height: 44px;
        margin-top: 12px;
      }
      a:focus-visible {
        outline: 3px solid #203442;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/makan-192.png" alt="ماکان" />
      <h1>ارتباط اینترنت برقرار نیست</h1>
      <p>
        برای مشاهده اطلاعات به‌روز و انجام کارهای پنل، اتصال اینترنت لازم است. پس از اتصال دوباره
        تلاش کنید.
      </p>
      <a href="/personal">تلاش دوباره</a>
    </main>
  </body>
</html>
