<!doctype html>
<html lang="fa" dir="rtl" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>ماکان — آموزش مجازی هوشمند</title>
    <meta
      name="description"
      content="ماکان: آموزشگاه آنلاین، کلاس، تکلیف، آزمون، پیام‌رسان و دستیار آموزشی در یک برنامه."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b1f26" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-64.png" sizes="64x64" type="image/png" />
    <link
      rel="preload"
      href="/icons/makan-192.png"
      as="image"
      type="image/png"
    />
    <link
      rel="preload"
      href="/fonts/vazirmatn-33.0.3.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ماکان" />
    <meta name="format-detection" content="telephone=no" />
    <style>
      /* Critical shell styles: paint the frame before the CSS chunk lands. */
      :root {
        color-scheme: light dark;
        --paper: #eef2f7;
        --ink: #0f0f0f;
      }
      html {
        background: var(--paper);
      }
      html[data-theme='dark'] {
        --paper: #14171c;
        --ink: #f5f5f5;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--paper);
        color: var(--ink);
        font-family: 'Vazirmatn', system-ui, -apple-system, 'Segoe UI', Tahoma,
          'Noto Sans Arabic', sans-serif;
      }
      #boot {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        gap: 14px;
      }
      #boot .boot-mark {
        width: 56px;
        height: 56px;
        border-radius: 18px;
        background-color: #156dee;
        background-image: url('/icons/makan-192.png');
        background-size: cover;
        background-position: center;
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      #boot .boot-text {
        font-size: 14px;
        opacity: 0.65;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.85;
        }
        50% {
          transform: scale(0.88);
          opacity: 0.55;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-mark {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="boot-mark"></div>
      <div class="boot-text">ماکان</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
