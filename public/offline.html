<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ماکان — بدون اتصال</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        gap: 14px;
        text-align: center;
        font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
        background: #eef2f7;
        color: #14171c;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #14171c;
          color: #f4f6fa;
        }
      }
      .mark {
        width: 56px;
        height: 56px;
        border-radius: 18px;
        background-color: #156dee;
        background-image: url(/icons/makan-192.png);
        background-size: cover;
        background-position: center;
      }
      h1 {
        font-size: 1.1rem;
        margin: 0;
      }
      p {
        margin: 0;
        font-size: 13px;
        opacity: 0.7;
        max-width: 34ch;
      }
      a {
        margin-top: 6px;
        padding: 10px 18px;
        border-radius: 999px;
        background: #156dee;
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="mark"></div>
    <h1>ارتباط با سرور برقرار نشد</h1>
    <p>داده‌های ذخیره‌شده پس از اتصال دوباره در دسترس هستند. ارسال‌های در صف پس از اتصال ارسال می‌شوند.</p>
    <a href="/school">تلاش دوباره</a>
  </body>
</html>
